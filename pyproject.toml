[project]
name = "shareit"
version = "1.0.0"
description = "A simple file sharing CLI tool."
readme = "README.md"
authors = [{ name = "Fahad Ahammed", email = "iamfahadahmed@gmail.com" }]
license = "MIT"
dependencies = [
  "psutil ==7.0.0",
  "rich ==14.0.0",
  "cryptography ==50.0.2"
]
requires-python = ">=3.11,<4.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
bandit = "^1.7.0"

[project.urls]
Homepage = "https://github.com/fahadahammed/shareit"
Repository = "https://github.com/fahadahammed/shareit"
Issues = "https://github.com/fahadahammed/shareit/issues"

[project.scripts]
shareit = "shareit.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
